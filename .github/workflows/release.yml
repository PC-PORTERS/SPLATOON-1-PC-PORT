name: Release

# Publishes a GitHub release with one package per platform when a version tag
# (v1.2, v1.2.3, ...) is pushed, or by hand from the Actions tab.
#
# The packages contain only this repository: the recompiler, the runtime, the
# setup scripts and the tools. No Nintendo material is (or may be) included;
# everyone builds the game from their own dump with Setup.bat / setup.sh.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (for example v1.2)'
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package Windows and Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build the packages
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          mkdir -p dist
          # Windows: zip with CRLF line endings for the .bat/.ps1 files.
          git -c core.autocrlf=true archive --format=zip --prefix="SPLATOON-1-PC-PORT-$TAG/" \
            -o "dist/SPLATOON-1-PC-PORT-$TAG-windows.zip" HEAD
          # Linux: tar.gz keeps setup.sh / build.sh executable.
          git archive --format=tar.gz --prefix="SPLATOON-1-PC-PORT-$TAG/" \
            -o "dist/SPLATOON-1-PC-PORT-$TAG-linux.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Splatoon 1 PC Port ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            ## Download

            | Platform | Package | Then run |
            |---|---|---|
            | Windows 10/11 (x64, NVIDIA) | `SPLATOON-1-PC-PORT-${{ steps.tag.outputs.name }}-windows.zip` | `Setup.bat` |
            | Linux (x64, Vulkan) | `SPLATOON-1-PC-PORT-${{ steps.tag.outputs.name }}-linux.tar.gz` | `./setup.sh --dump /path/to/your/dump` |

            The packages contain the source code and the setup only. You need **your own dump** of Splatoon
            (EUR, AGMP01 v16); the setup recompiles it into a native game on your PC. No game files are included.
            See the README for requirements and controls. Checksums: `SHA256SUMS.txt`.
          files: |
            dist/SPLATOON-1-PC-PORT-${{ steps.tag.outputs.name }}-windows.zip
            dist/SPLATOON-1-PC-PORT-${{ steps.tag.outputs.name }}-linux.tar.gz
            dist/SHA256SUMS.txt
